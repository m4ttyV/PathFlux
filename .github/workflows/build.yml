name: Windows build and tests
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine-version: ['1.12.2', '1.12.12', '1.13.21', '1.14.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PathFlux.slnx --locked-mode
      - run: dotnet build PathFlux.slnx -c Release --no-restore
      - name: Download and verify engine for compatibility tests
        shell: pwsh
        run: |
          $engine = .\scripts\get-engine.ps1 -Version '${{ matrix.engine-version }}' -Destination '.local\engine'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATHFLUX_TEST_ENGINE=$($engine.EnginePath)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATHFLUX_TEST_ENGINE_SHA256=$($engine.EngineSha256)"
      - run: dotnet test PathFlux.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Prepare isolated network lab without TUN
        shell: pwsh
        run: .\scripts\run-tun-lab.ps1 -EnginePath $env:PATHFLUX_TEST_ENGINE -EngineSha256 $env:PATHFLUX_TEST_ENGINE_SHA256 -Output '.local\ci-lab-prepare'
      - name: Native UI startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\PathFlux\bin\Release\net10.0\PathFlux.exe' -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw 'UI smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw 'UI smoke test failed' }
      - run: .\scripts\publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PathFlux-win-x64-engine-${{ matrix.engine-version }}
          path: artifacts/win-x64
